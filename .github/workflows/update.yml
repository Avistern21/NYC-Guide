name: Update and publish

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/images.json", "data/shows.auto.json", "data/update-log.json", "img/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Fetch images and events
        run: node scripts/update.mjs
        continue-on-error: true
      - name: Save changes
        run: |
          git config user.name "culture-guide-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data img
          git diff --cached --quiet || git commit -m "Nightly update" && git push || true
      - name: Build site folder
        run: |
          mkdir _site
          cp -r index.html data img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
