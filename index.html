<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The ADvantage</title>
<script>document.documentElement.dataset.theme="advantage"</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="midnight"]{--bg:#0b0a12;--card:#15131f;--ink:#f5f2fa;--mut:#a8a2b8;--line:#2a2638;--a1:#ff3d81;--a2:#ff9a3d;--on:#fff;color-scheme:dark}
:root[data-theme="gold"]{--bg:#0c0b09;--card:#16140f;--ink:#f6f0e2;--mut:#b5ac96;--line:#2e2a20;--a1:#e8b84a;--a2:#ffe08a;--on:#111;color-scheme:dark}
:root[data-theme="sunset"]{--bg:#170b1f;--card:#221030;--ink:#fff3ec;--mut:#c9afc0;--line:#3a2150;--a1:#ff5e5b;--a2:#ffb347;--on:#fff;color-scheme:dark}
:root[data-theme="violet"]{--bg:#0a0b1a;--card:#121430;--ink:#eef0ff;--mut:#a3a8d0;--line:#262a52;--a1:#7c5cff;--a2:#22d3ee;--on:#fff;color-scheme:dark}
:root[data-theme="gallery"]{--bg:#fff;--card:#fff;--ink:#000;--mut:#5f5f5f;--line:#d6d6d6;--a1:#000;--a2:#444;--on:#fff;color-scheme:light}
*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;color:var(--ink);font:400 15px/1.55 Inter,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0);
 background:radial-gradient(900px 420px at 12% -6%,color-mix(in srgb,var(--a1) 30%,transparent),transparent 62%),radial-gradient(760px 380px at 96% 0,color-mix(in srgb,var(--a2) 20%,transparent),transparent 60%),var(--bg);background-repeat:no-repeat}
.in,main{max-width:1040px;margin:0 auto;padding:0 20px}
a{color:inherit}a:hover{color:var(--a2)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
header{position:relative;padding:calc(54px + env(safe-area-inset-top,0)) 0 0}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin:0 0 14px;color:var(--a2)}
h1,h2,h3,.mo,.dnum{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}
h1{font-size:clamp(3rem,10vw,5.8rem);line-height:.95;letter-spacing:-.015em;margin-bottom:6px;padding-bottom:.1em;background:linear-gradient(95deg,var(--ink) 25%,var(--a2) 62%,var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(1rem,1.9vw,1.4rem);max-width:none;margin:0;color:var(--mut);line-height:1.4}
.themes{position:absolute;top:calc(18px + env(safe-area-inset-top,0));right:20px;display:flex;gap:8px}
.themes button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.themes button[aria-pressed=true]{border-color:var(--ink)}
nav{position:sticky;top:0;z-index:5;margin-top:26px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav a{padding:8px 15px;border-radius:99px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--mut);text-decoration:none;white-space:nowrap}
nav a:hover{color:var(--ink)}
nav a[aria-current=true]{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on)}
h2{font-size:2.4rem;margin:34px 0 4px}
.lead{color:var(--mut);margin:0 0 14px}
.mo{font-size:1.8rem;margin:44px 0 14px}
.mo:before{content:"";display:block;width:46px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--a1),var(--a2));margin-bottom:12px}
.tag{align-self:flex-start;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--a1) 22%,transparent);color:var(--ink)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ph{aspect-ratio:4/3;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font:500 3rem "Cormorant Garamond",serif}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35))}
.bdg{position:absolute;z-index:2;top:10px;left:10px;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px}
.card{display:flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0 0 16px;transition:transform .25s,box-shadow .25s,border-color .25s}
.card>*:not(.ph){margin:0 16px}
.card>.ph{margin:0 0 4px}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--a1) 60%,var(--line));box-shadow:0 14px 36px -14px color-mix(in srgb,var(--a1) 60%,transparent)}
.card:hover .ph img,.dc:hover .ph img{transform:scale(1.06)}
.card h3{font-size:1.45rem;line-height:1.12}
.card p{margin:0;color:var(--mut);font-size:.9rem}
.shows{list-style:none;padding:9px 0 0;border-top:1px solid var(--line);display:grid;gap:8px;font-size:.88rem}
.shows small{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--a2)}
.go{font-size:.9rem;margin-top:auto;padding-top:6px;font-weight:600;color:var(--a2);text-decoration:none}.go:hover{text-decoration:underline}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 20px 14px;margin:0 -20px;scrollbar-width:thin}
.dc{flex:0 0 min(78%,270px);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.dc .ph{aspect-ratio:4/5;border-radius:18px;font-size:4rem;margin-bottom:4px;box-shadow:0 10px 30px -14px #000}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dh h3{font-size:1.35rem;line-height:1.15}
.lb{font-size:.68rem;letter-spacing:.14em;font-weight:600;margin:0;text-transform:uppercase;color:var(--a2)}.lb span{font-weight:400;letter-spacing:.04em;color:var(--mut)}
.vn{font-size:.9rem;text-underline-offset:3px;color:var(--mut)}
button{font:inherit;cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 16px}
button.pill,button.pri{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on);border:0;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:8px 14px;white-space:nowrap;transition:filter .2s,transform .2s}
button.pill:hover:not([disabled]),button.pri:hover{filter:brightness(1.12);transform:translateY(-1px)}
button.pill[disabled]{background:var(--line);color:var(--mut);cursor:default}
button.x{border:0;padding:0;color:var(--mut);font-size:.85rem;text-align:left;border-radius:0}
.sb{width:100%;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-size:1rem;padding:14px 22px;margin-top:24px}
.ev{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.dnum{font-size:1.9rem;line-height:1;text-align:center;color:var(--a2)}.dnum small{display:block;font:600 .65rem Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ev .lead{margin:0}
details.add{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:24px 0}
details.add summary{cursor:pointer;font-weight:600}
form{display:grid;gap:10px;margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
form .wide{grid-column:1/-1}
label{display:grid;gap:3px;font-size:.85rem;color:var(--mut)}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.rsv{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px}.rsv label{min-width:160px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chips span{border:1px solid var(--line);padding:3px 12px;border-radius:99px;font-size:.85rem;color:var(--mut)}.chips .on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:var(--on);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--mut)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.fbar button{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:7px 15px;color:var(--mut)}
.fbar button[aria-pressed=true]{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on);border-color:transparent}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}
.mhead h3{font-size:1.8rem}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .dow{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--mut);text-align:center;padding:4px 0}
.mgrid .cell{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mgrid .cell.out{opacity:.35}
.mgrid .cell.today{border-color:var(--a2);box-shadow:0 0 0 1px var(--a2)}
.mgrid .cell b{font-size:.78rem;font-weight:600;color:var(--mut)}
.mgrid .cell.today b{color:var(--a2)}
.mgrid .cell a,.mgrid .cell span.e{font-size:.66rem;line-height:1.2;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--a1) 28%,transparent);color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
@media(max-width:600px){.mgrid .cell{min-height:64px;padding:3px}.mgrid .cell a,.mgrid .cell span.e{font-size:.58rem;padding:1px 3px}}

#banner{max-width:1040px;margin:0 auto;padding:30px 20px 0}
#banner .bh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
#banner .bh strong{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--a2)}
#banner .bh button{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:6px 14px;color:var(--mut)}
.bnr{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.bnr::-webkit-scrollbar{display:none}
.bs{position:relative;flex:0 0 min(86%,420px);aspect-ratio:16/10;border-radius:20px;overflow:hidden;scroll-snap-align:start;color:#fff;text-decoration:none;display:flex;align-items:flex-end;background:#222;box-shadow:0 14px 34px -16px #000;transition:transform .3s}
.bs:hover{transform:translateY(-3px);color:#fff}
.bs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.bs:hover img{transform:scale(1.05)}
.bs:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.78));z-index:1}
.bs .bt{position:relative;z-index:2;padding:16px 18px;display:grid;gap:3px}
.bs .bk{justify-self:start;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:3px 10px;border-radius:99px;background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--on)}
.bs h3{font-size:1.45rem;line-height:1.08;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bs span.bv{font-size:.82rem;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs .bt{min-width:0;max-width:100%}
@media(max-width:600px){.bs{flex-basis:80%;aspect-ratio:4/3}.bs h3{font-size:1.25rem}}
.stabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:10px 0 14px;overflow-x:auto;scrollbar-width:none}
.stabs button{border:0;border-radius:0;background:transparent;padding:12px 22px;margin-bottom:-1px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.stabs button:hover{color:var(--ink)}
.stabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--a1)}
.stabs small{font-size:.7rem;font-weight:500;opacity:.7;margin-left:6px}
.bkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.bkrow input{width:auto;flex:1 1 140px;min-width:0;padding:8px 10px}

@font-face{font-family:"Montserrat";font-weight:700;src:url(img/fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:800;src:url(img/fonts/montserrat-latin-800-normal.woff2) format("woff2")}

:root[data-theme="advantage"]{--bg:#0d0d10;--card:#17171c;--ink:#fff;--mut:#bcbcc8;--line:#2d2d38;--a1:#ffcc2e;--a2:#ffcc2e;--on:#0d0d10;--blue:#0b3bd9;--coral:#ff5a47;--yel:#ffcc2e;color-scheme:dark}
[data-theme=advantage] body{background:var(--bg);font-family:Montserrat,Inter,system-ui,sans-serif}
[data-theme=advantage] *{border-radius:0!important}
[data-theme=advantage] h1,[data-theme=advantage] h2,[data-theme=advantage] h3,[data-theme=advantage] .mo,[data-theme=advantage] .dnum,[data-theme=advantage] .ph{font-family:Montserrat,Inter,sans-serif;font-weight:800;letter-spacing:-.02em}

[data-theme=advantage] .fbar button[aria-pressed=true],[data-theme=advantage] .chips .on{background:var(--yel);color:#0d0d10}

.adv{position:sticky;top:0;z-index:30;background:#0d0d10;padding:0}
.adv .top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 32px;flex-wrap:wrap}

#catbar a:hover,#catbar a[aria-current=true],#catbar2 a:hover{color:var(--yel)}

main[data-k=calendar],main[data-k=reads],main[data-k=discover],main[data-k=now],main[data-k=broadway],main[data-k=dance],main[data-k=music],main[data-k=museums],main[data-k=galleries],main[data-k=restaurants]{max-width:none;padding:0}

  return '<article class="card">'+tile(v.name,pickImg(v)||(imgs.venues[v.id]||{}).file)+(v.area?'<span class="tag">'+esc(v.area)+'</span>':'')+'<h3>'+esc(v.name)+'</h3>'+(v.note?'<p>'+esc(v.note)+'</p>':'')+
   (s.length?'<ul class="shows">'+s.map(o=>'<li><small>'+esc(o.label)+'</small><a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+esc(o.title)+'</a></li>').join("")+'</ul>':'')+
   (u?'<a class="go" href="'+esc(v.cat==="restaurants"?bookUrl(u):u)+'" target="_blank" rel="noopener">'+(v.cat==="restaurants"?bookLabel(u):"Visit "+esc(host(u)))+'</a>':'')+(own?'<button class="x" data-del="'+esc(v.id)+'">Remove</button>':'')+bkBtn(v)+'</article>'}

const addForm=()=>'<details class="add"><summary>Add to this list</summary><form id="addf"><label>Name<input name="name" required></label><label>Neighborhood or city<input name="area"></label><label class="wide">Link<input name="url" type="url" placeholder="https://"></label><label class="wide">Why we love it<input name="note"></label><div class="wide"><button class="pri" type="submit">Save pick</button></div></form><p class="lead" style="margin:10px 0 0">Saved in this browser. To share a pick with your wife, add it to <code>data/picks.json</code> (see README).</p></details>';

function dc(o){const u=safe(o.url);
  return '<article class="dc" data-q="'+esc((o.title+" "+o.v.name+" "+o.v.cat).toLowerCase())+'">'+tile(o.v.name,o.img,o.start<=TODAY?"On now":"Opens "+md(o.start))+'<div class="dh"><h3>'+esc(o.title)+'</h3>'+addBtn(o)+'</div><p class="lb">'+LAB[o.v.cat]+' <span>• '+esc(o.label)+'</span></p>'+
   (u?'<a class="vn" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(o.v.name)+' →</a>':'<span class="vn">'+esc(o.v.name)+'</span>')+'</article>'}
const rail=(t,a)=>a.length?'<div class="mo">'+t+'</div><div class="rail">'+a.slice(0,14).map(dc).join("")+'</div>':"";
const cat=c=>L.filter(o=>c.includes(o.v.cat));

function dash(){return '<input class="sb" id="q" placeholder="Search shows and venues…" aria-label="Search"><h2>Dashboard</h2><p class="lead">What’s on now and coming up across our stages, museums, and galleries.</p>'+
  (L.length?rail("Opening soon",L.filter(o=>o.start>TODAY))+rail("On view now",L.filter(o=>o.start<=TODAY))+rail("Dance and music",cat(["dance","music"]))+rail("Museums",cat(["museums"]))+rail("Galleries",cat(["galleries"])):'<div class="empty">No shows listed right now.</div>')}

function whatson(){

  const bar='<div class="fbar" role="group" aria-label="Filter">'+FT.map(t=>'<button type="button" data-wf="'+t[0]+'" aria-pressed="'+(wf===t[0])+'">'+t[1]+'</button>').join("")+'</div>';
  const bwItems=()=>picks.filter(p=>p.cat==="broadway").map(p=>{const id="p-"+slug(p.name),mm=(p.note||"").match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w* (\d{1,2})/),up=p.status==="upcoming";
    let st=TODAY;if(up){if(mm){const mi=MON.indexOf(mm[1]),yr=+TODAY.slice(0,4)+(mi<+TODAY.slice(5,7)-1?1:0);st=yr+"-"+String(mi+1).padStart(2,"0")+"-"+String(mm[2]).padStart(2,"0")}else st=addDays(TODAY,30)}
    return {id,v:{id,cat:"broadway",name:p.area||"Broadway"},title:p.name,start:st,end:st,label:p.note||"Open run",url:p.site||p.url,img:pickImg(p)||(imgs.venues[id]||{}).file,bw:true,status:p.status}}).sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
  const LL=wf==="all"?L:wf==="broadway"?bwItems():L.filter(o=>o.v.cat===wf);
  const wk=new Date(Date.parse(TODAY)+7*864e5).toISOString().slice(0,10);
  const MODE=new URLSearchParams(location.search).get("cards")||"both";
  let bi=0;
  const cbox=o=>{const u=safe(o.url),i=bi++%3,d=new Date(o.start+"T12:00:00");
    const when=o.bw?(o.status==="upcoming"?"Coming soon":o.status==="closing"?"Closing soon":"Now playing"):o.start<=TODAY?"On now":"Opens "+MON[d.getMonth()]+" "+d.getDate();
    const im=MODE==="both"&&o.img&&!o.logo?'<div class="cimg"><img src="'+esc(o.img)+'" alt=""></div>':"";
    return '<article class="ct c'+i+(MODE==="both"?" both":"")+'">'+im+'<div class="cb"><span class="ctag">'+(CATNAME[o.v.cat]||"")+' · '+when+'</span><h3>'+esc(o.title)+'</h3><p>'+esc(o.v.name)+' · '+esc(o.label)+'</p><div class="cact">'+(u?'<a class="go" href="'+esc(u)+'" target="_blank" rel="noopener">More info →</a>':'')+(o.bw?bkBtn(o.v):addBtn(o))+'</div></div></article>'};
  const box1=o=>{const u=safe(o.url);return '<article class="card">'+tile(o.v.name,o.img,o.start<=TODAY?"On now":"Opens "+md(o.start))+'<span class="tag">'+(CATNAME[o.v.cat]||"")+'</span><h3>'+esc(o.title)+'</h3><p>'+esc(o.v.name)+' · '+esc(o.label)+'</p>'+(u?'<a class="go" href="'+esc(u)+'" target="_blank" rel="noopener">More info</a>':'')+'<div style="margin-top:6px">'+addBtn(o)+'</div></article>'};
  const box=o=>MODE?cbox(o):box1(o);
  const row=o=>{const d=new Date(o.start+"T12:00:00");return '<div class="ev"><div class="dnum">'+(o.start<=TODAY?'Now':d.getDate()+'<small>'+MON[d.getMonth()]+'</small>')+'</div><div><strong><a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+esc(o.title)+'</a></strong><br><span class="lead">'+esc(o.v.name)+' · '+esc(o.label)+'</span></div>'+addBtn(o)+'</div>'};
  const G=[["now","On now",LL.filter(o=>o.start<=TODAY)],["week","Next 7 days",LL.filter(o=>o.start>TODAY&&o.start<=wk)],["soon","Coming soon",LL.filter(o=>o.start>wk)]];
  const tabs='<div class="stabs" role="tablist" aria-label="When">'+G.map(g=>'<button type="button" role="tab" data-wt="'+g[0]+'" aria-pressed="'+(wt===g[0])+'">'+g[1]+'<small>'+g[2].length+'</small></button>').join("")+'</div>';
  const cur=G.find(g=>g[0]===wt)||G[0];
  return '<section class="phead"><div class="in2"><h2>What’s On</h2><p class="lead">Recommendations beyond our own picks. Shuffle for more.</p>'+bar.replace('</div>','<button type="button" class="shufbtn" data-wshuf="1">Shuffle <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button></div>')+'</div></section><section class="pbody"><div class="in2">'+tabs+(cur[2].length?'<div class="grid">'+(wsd!==null?sshuf(cur[2],wsd):cur[2]).map(box).join("")+'</div>':'<div class="empty">Nothing here right now. Try another tab or category.</div>')+'</div></section>'}

function monthView(ev){
  const [y,m]=cm.split("-").map(Number),first=new Date(y,m-1,1),start=first.getDay(),dim=new Date(y,m,0).getDate();
  const pad=n=>String(n).padStart(2,"0"),by={};ev.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  let h='<div class="mhead"><button type="button" data-cm="-1" aria-label="Previous month">&larr;</button><h3>'+first.toLocaleString("en-US",{month:"long",year:"numeric"})+'</h3><button type="button" data-cm="1" aria-label="Next month">&rarr;</button></div><div class="mgrid">';
  h+=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>'<div class="dow">'+d+'</div>').join("");
  const total=Math.ceil((start+dim)/7)*7;
  for(let i=0;i<total;i++){const dt=new Date(y,m-1,1-start+i),ds=dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
    const es=(by[ds]||[]).map(e=>{const u=safe(e.url);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" title="'+esc(e.title)+'">'+esc(e.title)+'</a>':'<span class="e" title="'+esc(e.title)+'">'+esc(e.title)+'</span>'}).join("");
    h+='<div class="cell'+(dt.getMonth()!==m-1?" out":"")+(ds===TODAY?" today":"")+'"><b>'+dt.getDate()+'</b>'+es+'</div>'}
  return h+'</div>'+(ev.length?"":'<p class="lead" style="margin-top:12px">Nothing on the calendar yet. Use Add on any show in What’s On.</p>')}
function calendar(){
  const ev=events.slice().sort((a,b)=>a.date<b.date?-1:1);let h='<h2>Calendar</h2><p class="lead">Our own plans. Use Add on any show to put it here.</p>';
  h+='<details class="add"><summary>Add an event</summary><form id="evf"><label>Date<input name="date" type="date" required></label><label>Type<select name="type"><option>Dance</option><option>Music</option><option>Broadway</option><option>Dinner</option><option>Museum</option></select></label><label class="wide">What<input name="title" required></label><label>Where<input name="where"></label><label>Tickets or booking link<input name="url" type="url" placeholder="https://"></label><div class="wide"><button class="pri" type="submit">Add to calendar</button></div></form></details>';
  h+='<div class="fbar" role="group" aria-label="Calendar view"><button type="button" data-cv="list" aria-pressed="'+(cv==="list")+'">List</button><button type="button" data-cv="month" aria-pressed="'+(cv==="month")+'">Calendar</button></div>';
  if(cv==="month")return h+monthView(ev);
  if(!ev.length)h+='<div class="empty">Nothing on the calendar yet.</div>';
  let last="";for(const e of ev){const d=new Date(e.date+"T12:00:00"),m=d.toLocaleString("en-US",{month:"long",year:"numeric"});if(m!==last){h+='<div class="mo">'+m+'</div>';last=m}
    const u=safe(e.url);h+='<div class="ev"><div class="dnum">'+d.getDate()+'<small>'+d.toLocaleString("en-US",{weekday:"short"})+'</small></div><div><strong>'+esc(e.title)+'</strong><br><span class="lead">'+esc(e.type)+(e.where?" at "+esc(e.where):"")+(u?' · <a href="'+esc(u)+'" target="_blank" rel="noopener">Tickets</a>':"")+'</span></div><button class="x" data-evdel="'+esc(e.id)+'">Remove</button></div>'}
  return h}

function pickList(c){return picks.filter(p=>p.cat===c).map(p=>({...p,id:"p-"+slug(p.name)})).concat(mine.filter(p=>p.cat===c))}
function articlesView(){
  const srcs=["WSJ Review","Goings On"].filter(k=>(arts[k]||[]).length);if(!srcs.length)return"";
  const all=srcs.flatMap(k=>arts[k]).filter(a=>safe(a.url)).sort((a,b)=>(b.date||"")<(a.date||"")?-1:1);
  if(af!=="all"&&!srcs.includes(af))af="all";
  const pool=af==="all"?all:all.filter(a=>a.source===af);
  const secs=[...new Set(pool.map(a=>a.section).filter(Boolean))];
  if(sf!=="all"&&!secs.includes(sf))sf="all";
  const list=sf==="all"?pool:pool.filter(a=>a.section===sf);
  const chip=(a,k,cur,l)=>'<button type="button" data-'+a+'="'+esc(k)+'" aria-pressed="'+(cur===k)+'">'+esc(l)+'</button>';
  return '<div class="mo">Latest articles</div><div class="fbar" role="group" aria-label="Publication">'+chip("af","all",af,"All")+srcs.map(k=>chip("af",k,af,k)).join("")+'</div>'+
   (secs.length>1?'<div class="fbar" role="group" aria-label="Section">'+chip("sf","all",sf,"Every section")+secs.map(k=>chip("sf",k,sf,k)).join("")+'</div>':"")+'<div class="grid">'+
   list.slice(0,30).map(a=>'<article class="card"><a href="'+esc(a.url)+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:contents">'+tile(a.source,/^https:/.test(a.image||"")?a.image:"")+'</a><span class="tag">'+esc(a.section||a.source)+(a.date?' · '+esc(md(a.date)):"")+'</span><h3>'+esc(a.title)+'</h3>'+(a.blurb?'<p>'+esc(a.blurb)+'</p>':"")+'<a class="go" href="'+esc(a.url)+'" target="_blank" rel="noopener">Read article</a></article>').join("")+'</div>'}
const CATNAME={dance:"Dance",music:"Music",museums:"Museum",galleries:"Gallery",broadway:"Broadway"};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildMix(){
  const out=[];
  ["dance","music","museums","galleries"].forEach(c=>{
    const seen=new Set(),pool=shuf(L.filter(o=>o.v.cat===c));
    pool.filter(o=>!seen.has(o.v.id)&&seen.add(o.v.id)).slice(0,3).forEach(o=>out.push({c,show:o}))});
  shuf(picks.filter(p=>p.cat==="broadway")).slice(0,3).forEach(p=>out.push({c:"broadway",pick:{...p,id:"p-"+slug(p.name)}}));
  return shuf(out)}
function discoverMix(){
  if(!mix)mix=buildMix();
  if(!mix.length)return"";
  return '<div class="fbar"><button type="button" class="pill" data-shuffle="1">Shuffle picks <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button></div><div class="grid">'+mix.map(m=>{
    if(m.pick)return venueCard(m.pick,false).replace('<span class="tag">','<span class="tag">Broadway · ');
    const o=m.show,u=safe(o.url);
    return '<article class="card">'+tile(o.v.name,o.img,o.start<=TODAY?"On now":"Opens "+md(o.start))+'<span class="tag">'+CATNAME[m.c]+'</span><h3>'+esc(o.title)+'</h3><p>'+esc(o.v.name)+' · '+esc(o.label)+'</p>'+(u?'<a class="go" href="'+esc(u)+'" target="_blank" rel="noopener">More info</a>':'')+'<div style="margin-top:6px">'+addBtn(o)+'</div></article>'}).join("")+'</div>'}
function listView(k,t,sub){
  const base=venues.filter(v=>v.cat===k),extra=pickList(k),ids=new Set(mine.map(m=>m.id));
  const shown=k==="broadway"&&bf!=="all"?extra.filter(p=>bf==="saved"?saved.includes(p.id):p.status===bf):extra;
  const all=base.concat(shown);
  if(["broadway","dance","music","museums","galleries","restaurants"].includes(k)){
    let ci=0;const fb=k==="broadway"?'<div class="fbar" role="group" aria-label="Filter">'+[["all","All"],["new","New"],["upcoming","Upcoming"],["saved","Saved"]].map(t=>'<button type="button" data-bf="'+t[0]+'" aria-pressed="'+(bf===t[0])+'">'+t[1]+'</button>').join("")+'</div>':"";
    const cv=(v,own)=>{const i=ci++%3,s=L.filter(o=>o.v.id===v.id).slice(0,3),u=safe(v.url),img=pickImg(v)||(imgs.venues[v.id]||{}).file;
      return '<article class="ct c'+i+'">'+(img?'<div class="cimg"><img src="'+esc(img)+'" alt="" loading="lazy"></div>':"")+'<div class="cb">'+(v.area?'<span class="ctag">'+esc(v.area)+'</span>':'')+'<h3>'+esc(v.name)+'</h3>'+(v.note?'<p>'+esc(v.note)+'</p>':'')+
       (s.length?'<ul class="cshows">'+s.map(o=>'<li><b>'+esc(o.label)+'</b> <a href="'+esc(o.url)+'" target="_blank" rel="noopener">'+esc(o.title)+'</a></li>').join("")+'</ul>':'')+
       '<div class="cact">'+(u?'<a class="go" href="'+esc(v.cat==="restaurants"?bookUrl(u):u)+'" target="_blank" rel="noopener">'+(v.cat==="restaurants"?bookLabel(u):(/google\./.test(host(u))?"Find info":"Visit "+esc(host(u))))+' →</a>':'')+(own?'<button class="x" data-del="'+esc(v.id)+'">Remove</button>':'')+'</div>'+bkBtn(v)+'</div></article>'};
    const empty=k==="broadway"&&extra.length?(bf==="saved"?"Nothing saved yet. Tap Add on a show to keep it here.":"Nothing in this group right now."):(EMPTY[k]||"");
    return '<section class="phead"><div class="in2"><h2>'+t+'</h2><p class="lead">'+sub+'</p>'+fb+'</div></section><section class="pbody"><div class="in2">'+(k==="restaurants"?rsvBar():"")+(all.length?'<div class="grid">'+all.map(v=>cv(v,ids.has(v.id))).join("")+'</div>':'<div class="empty">'+empty+'</div>')+addForm()+'</div></section>'}
  let h='<h2>'+t+'</h2><p class="lead">'+sub+'</p>';
  if(k==="discover")h+='<div class="chips"><span class="on">New York</span><span>London (soon)</span><span>Paris (soon)</span><span>Tokyo (soon)</span></div>';
  if(k==="restaurants")h+=rsvBar();
  if(k==="broadway")h+='<div class="fbar" role="group" aria-label="Filter">'+[["all","All"],["new","New"],["upcoming","Upcoming"],["saved","Saved"]].map(t=>'<button type="button" data-bf="'+t[0]+'" aria-pressed="'+(bf===t[0])+'">'+t[1]+'</button>').join("")+'</div>';
  let dm="";if(k==="discover"){dm=discoverMix();h+=dm?'<p class="lead">A fresh mix from our dance, music, museum, gallery and Broadway lists. Shuffle for more.</p>'+dm:""}
  if(k==="reads")h+=articlesView();
  if(k==="reads"&&all.length)h+='<div class="mo">Our picks</div>';
  h+=all.length?'<div class="grid">'+all.map(v=>venueCard(v,ids.has(v.id))).join("")+'</div>':(k==="reads"&&h.includes("Latest articles")||dm?"":'<div class="empty">'+(k==="broadway"&&extra.length?(bf==="saved"?"Nothing saved yet. Tap Add on a show to keep it here.":"Nothing in this group right now."):(EMPTY[k]||""))+'</div>');
  return h+addForm()}


function homeView(){
  const near=L.filter(o=>o.start<=addDays(TODAY,14)&&o.img&&(o.own||!o.v.logo));
  const hp=new URLSearchParams(location.search).get("hero");
  let hero=hp?L.find(o=>o.title.toLowerCase().includes(hp.toLowerCase())):shuf(near)[0];
  hero=hero||near[0]||L[0];
  const dates=o=>o.start<=TODAY?"On now":(o.label||"");
  const heroHtml=hero?'<a class="ft" href="'+esc(hero.url||"#now")+'" target="_blank" rel="noopener"><small>'+esc((CATNAME[hero.v.cat]||"")+" · "+dates(hero))+'</small><b>'+esc(hero.title)+' →</b></a>':"";
  const wk=addDays(TODAY,7),pool=L.filter(o=>o.start<=wk&&o.end>=TODAY),usedC=new Set(),tiles=[];
  shuf(pool).forEach(o=>{if(tiles.length<3&&!usedC.has(o.v.cat)){usedC.add(o.v.cat);tiles.push({t:o.title,m:o.v.name+" • "+(o.start<=TODAY?"Through "+md(o.end):o.label),u:o.url})}});
  if(tiles.length<3)shuf(picks.filter(p=>p.cat==="broadway"&&p.status==="playing")).slice(0,3-tiles.length).forEach(p=>tiles.push({t:p.name,m:p.area+" • Ongoing",u:p.url}));
  return '<section class="hero"><div class="l"><div class="eb">NYC Culture Guide</div><h1>Go out.<br>Get into it.</h1><p class="sb">Art, stages, and tables worth chasing.</p><a class="cta" href="#now">See what’s on →</a></div><div class="r">'+(hero&&hero.img?'<img src="'+esc(hero.img)+'" alt="">':"")+heroHtml+'</div></section>'+
   '<section class="week"><div class="wh"><h2>The Week Ahead</h2><a href="#now">View more →</a></div><div class="wg">'+tiles.map((t,i)=>'<a class="wt c'+i+'" href="'+esc(safe(t.u)||"#now")+'" target="_blank" rel="noopener"><h3>'+esc(t.t)+'</h3><span>'+esc(t.m)+'</span></a>').join("")+'</div></section>'}
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};

let dpk=null,dlast="",wsd=null;
const sshuf=(a,seed)=>{a=a.slice();let t=seed>>>0;const r=()=>{t+=0x6D2B79F5;let x=Math.imul(t^t>>>15,1|t);x^=x+Math.imul(x^x>>>7,61|x);return((x^x>>>14)>>>0)/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function drawDisc(force){
  const el=document.getElementById("disc");if(!el)return;
  const h=location.hash||"#home";
  if(force||!dpk||h!==dlast){const pool=buildMix().filter(m=>m.pick?(pickImg(m.pick)||(imgs.venues[m.pick.id]||{}).file):(m.show.img&&(m.show.own||!m.show.v.logo)));
    const seenC={},out=[];pool.forEach(m=>{const c=m.pick?"broadway":m.show.v.cat;if(out.length<8&&!seenC[c]){seenC[c]=1;out.push(m)}});pool.forEach(m=>{if(out.length<8&&!out.includes(m))out.push(m)});dpk=out;dlast=h}
  if(!dpk.length){el.innerHTML="";return}
  const col=["var(--yel)","var(--coral)","#fff"];
  el.innerHTML='<div class="hbn"><div class="hs">'+dpk.map((m,i)=>{
    let img,t,sub,u,cat;
    if(m.pick){img=pickImg(m.pick)||(imgs.venues[m.pick.id]||{}).file;t=m.pick.name;sub=m.pick.area||"Broadway";u=safe(m.pick.site||m.pick.url);cat="Broadway"}
    else{const o=m.show;img=o.img;t=o.title;sub=o.v.name;u=safe(o.url);cat=CATNAME[o.v.cat]||""}
    const when=m.pick?(m.pick.status==="upcoming"?"Coming soon":"Now playing"):(m.show.start<=TODAY?"On now":m.show.label);
    return '<div class="hsl"><img src="'+esc(img)+'" alt=""><a class="hbtn" href="'+esc(u||"#now")+'" target="_blank" rel="noopener"><small>'+esc(cat)+' · '+esc(when)+'</small><b>'+esc(t)+' →</b>'+(sub?'<i>'+esc(sub)+'</i>':'')+'</a></div>'
}).join("")+'</div></div>'}

function render(){
  let k=(location.hash||"#home").slice(1);if(k==="discover")k="now";if(k!=="home"&&!CATS.some(c=>c[0]===k))k="home";
  const link=(id,label,cls)=>{const c=CATS.find(x=>x[0]===id);return '<a href="#'+id+'"'+(cls?' class="'+cls+'"':"")+(k===id?' aria-current="true"':"")+'>'+(label||c[1])+'</a>'};
  document.getElementById("nav").innerHTML=link("now")+link("calendar")+link("reads");
  const cb=["broadway","dance","music","museums","galleries","restaurants"].map(id=>link(id)).join("");
  const cbEl=document.getElementById("catbar");cbEl.innerHTML=cb;
  drawDisc();
  const v=document.getElementById("view"),c=CATS.find(x=>x[0]===k)||[];v.dataset.k=k;
  let hv=k==="home"?homeView().replace(/<section class="hero">[\s\S]*?<\/section>/,""):k==="now"?whatson():k==="calendar"?calendar():listView(k,c[1],c[2]);
  if(["calendar","reads","discover"].includes(k)){const m=hv.match(/^<h2>(.*?)<\/h2><p class="lead">(.*?)<\/p>([\s\S]*)$/);if(m)hv='<section class="phead"><div class="in2"><h2>'+m[1]+'</h2><p class="lead">'+m[2]+'</p></div></section><section class="pbody"><div class="in2">'+m[3]+'</div></section>'}
  v.innerHTML=hv;
}

document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,d=new FormData(f),k=document.getElementById("view").dataset.k;
  if(f.id==="addf")mine.push({id:"m"+Date.now(),cat:k,name:d.get("name"),area:d.get("area"),url:d.get("url"),note:d.get("note")});
  else if(f.id==="evf")events.push({id:"e"+Date.now(),date:d.get("date"),type:d.get("type"),title:d.get("title"),where:d.get("where"),url:d.get("url")});

  if(t.dataset.evdel){events=events.filter(i=>i.id!==t.dataset.evdel);save();render()}});

function drawBanner(){

  if(!bmix.length){el.innerHTML="";return}
  el.innerHTML='<div class="bh"><strong>Discover</strong><button type="button" data-bshuffle="1">Shuffle</button></div><div class="bnr">'+bmix.map(m=>{
    const p=m.pick,o=m.show,name=p?p.name:o.title,sub=p?p.area:o.v.name+" · "+o.label,img=p?(pickImg(p)||(imgs.venues[p.id]||{}).file):o.img,u=safe(p?p.url:o.url),lab=p?"Broadway":CATNAME[m.c];
    return '<a class="bs" href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(img)+'" alt="" loading="lazy" onerror="this.remove()"><div class="bt"><span class="bk">'+esc(lab)+'</span><h3>'+esc(name)+'</h3><span class="bv">'+esc(sub)+'</span></div></a>'}).join("")+'</div>'}

function drawThemes(){const cur=document.documentElement.dataset.theme;document.getElementById("themes").innerHTML=THEMES.map(t=>'<button type="button" data-theme="'+t[0]+'" title="'+t[1]+'" aria-label="'+t[1]+' theme" aria-pressed="'+(t[0]===cur)+'" style="background:linear-gradient(135deg,'+t[2]+','+t[3]+')"></button>').join("")}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-wf],[data-wt],[data-cv],[data-cm],[data-af],[data-sf],[data-bf],[data-shuffle],[data-wshuf],[data-bk],[data-bd],[data-bdgo],[data-bdx],[data-bdclr]");if(!t)return;
  if(t.dataset.bd){bd=t.dataset.bd}else if(t.dataset.bdx){bd=null}
  else if(t.dataset.bdclr){const k=events.findIndex(x=>x.bk===t.dataset.bdclr);if(k>=0)events.splice(k,1);bd=null;save()}
  else if(t.dataset.bdgo){const d=t.closest(".card").querySelector('input[type=date]').value;if(!d)return;
    const id=t.dataset.bdgo,p=picks.find(x=>"p-"+slug(x.name)===id)||{},e=events.find(x=>x.bk===id);
    if(e)e.date=d;else events.push({id:"e"+Date.now(),date:d,type:"Broadway",title:p.name||"Broadway show",where:p.area||"",url:p.url||"",bk:id});
    bd=null;save()}
  else if(t.dataset.bk){const id=t.dataset.bk,k=saved.indexOf(id);if(k>=0)saved.splice(k,1);else saved.push(id);save()}
  else if(t.dataset.wt)wt=t.dataset.wt;else if(t.dataset.bf)bf=t.dataset.bf;else if(t.dataset.shuffle)mix=null;else if(t.dataset.wshuf){wsd=Math.random()*1e9|0;dpk=null}else if(t.dataset.af){af=t.dataset.af;sf="all"}else if(t.dataset.sf)sf=t.dataset.sf;else if(t.dataset.wf)wf=t.dataset.wf;else if(t.dataset.cv)cv=t.dataset.cv;else{const [y,m]=cm.split("-").map(Number),d=new Date(y,m-1+Number(t.dataset.cm),1);cm=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
  render()});
